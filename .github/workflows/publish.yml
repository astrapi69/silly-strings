# Publishes the artifact to Maven Central via the Central Portal (nmcp settings plugin), as the rest of the
# family does. Triggered by pushing a release tag (RELEASE-*), which always targets the release
# repository, or manually via workflow_dispatch, which asks where to publish. gradle.yml only builds (#13).
#
# The manual snapshot run exists so this path can be EXECUTED rather than only wired: it
# exercises the checkout, the JDK setup, the Gradle setup, the secrets and the signature -
# everything the tag run does except the release bundle's check and upload. Run it after any change to
# this file, on develop, before a release tag depends on it.
# Required repository secrets:
#   CENTRAL_PORTAL_TOKEN_USERNAME / CENTRAL_PORTAL_TOKEN_PASSWORD - Central Portal user token
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE    - ascii-armored signing key and its passphrase
#   GPG_KEY_ID (optional)               - the signing subkey's last 8 hex digits, when GPG_PRIVATE_KEY
#                                         holds that subkey alone (astrapi69/lethenon, docs/launch/release-key.md; astrapi69/file-worker#9)

name: Publish to Maven Central

on:
  push:
    tags: [ 'RELEASE-*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish (a tag push always publishes a release)'
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release

# The job runs the build, with its tests and plugins, and holds the signing secrets: it gets a token that reads the
# repository only, as gradle.yml does, so that nothing of the build can push a branch or move a RELEASE tag (#52)
permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    env:
      # a tag push publishes a release; a manual run publishes what it was asked for. This build
      # publishes through the settings plugin, so the tasks are the aggregation's.
      PUBLISH_TASK: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'snapshot') && 'nmcpPublishAggregationToCentralPortalSnapshots' || 'nmcpPublishAggregationToCentralPortal' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # The JDK .sdkmanrc names, as the full semver of Adoptium: with '25' or '25.0.5' setup-java takes whatever
      # matches first, such as a later patch release from the runner image (astrapi69/file-worker#97)
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'
      - name: Check the JDK is the one .sdkmanrc names
        run: |
          # sdkman names Temurin 25.0.5+8 "25.0.5.0+8-tem", the JDK's release file "Temurin-25.0.5+8". The
          # build counts too: JAVA_VERSION, which this step read before, says 25.0.5 for every build of it (#70)
          candidate=$(sed -n 's/^java=\(.*\)-tem$/\1/p' .sdkmanrc)
          want="Temurin-${candidate/.0+/+}"
          have=$(sed -n 's/^IMPLEMENTOR_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          vendor=$(sed -n 's/^IMPLEMENTOR="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          echo ".sdkmanrc names $candidate-tem, that is $want; set up: $vendor $have"
          [ -n "$candidate" ] && [ "$have" = "$want" ] && [ "$vendor" = "Eclipse Adoptium" ]
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      # nmcp uploads and validates the bundle directly - no separate staging step
      - name: Publish to the Central Portal
        run: |
          echo "publishing with $PUBLISH_TASK"
          ./gradlew "$PUBLISH_TASK"
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
