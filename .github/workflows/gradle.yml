# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# the build reads the repository only; publish-badges, which writes, asks for that itself
permissions:
  contents: read

# Builds, tests and checks the coverage. The mutation testing runs in mutation-testing.yml (#59)

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # The JDK .sdkmanrc names, as the full semver of Adoptium: with '25' or '25.0.4' setup-java takes whatever
      # matches first, such as a later patch release from the runner image (astrapi69/file-worker#97)
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.4+7.0.LTS'
          distribution: 'temurin'
      - name: Check the JDK is the one .sdkmanrc names
        run: |
          want=$(sed -n 's/^java=\([0-9.]*\)-tem$/\1/p' .sdkmanrc)
          have=$(sed -n 's/^JAVA_VERSION="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          vendor=$(sed -n 's/^IMPLEMENTOR="\(.*\)"$/\1/p' "$JAVA_HOME/release")
          echo ".sdkmanrc names Temurin $want; set up: $vendor $have"
          [ -n "$want" ] && [ "$have" = "$want" ] && [ "$vendor" = "Eclipse Adoptium" ]
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Execute Gradle build
        run: ./gradlew build
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
